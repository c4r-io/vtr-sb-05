<style>

.choice h3{margin-bottom:.375rem}

.charts{display:grid;grid-template-columns:1fr;gap:1rem}

.scenario{border-top:1px solid var(--border);padding-top:1rem;margin-top:1rem}
.chart{min-width:0}
.chart h4{font-size:0.875rem;margin:0 0 .25rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart{padding-bottom:0}
.diff-banner{background:#eee0ff;color:var(--accent-dark);font-weight:600;padding:.5rem 1rem;margin:.5rem -1rem 0;border-radius:0 0 6px 6px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.25rem 1rem;font-variant-numeric:tabular-nums}
.diff-banner .n{font-weight:400;font-size:0.875rem;color:var(--fg)}
.study{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;margin-bottom:1rem}
.study dt{font-weight:600;color:var(--accent);text-transform:uppercase;font-size:0.875rem;letter-spacing:.04em;padding-top:.15rem}
.study dd{margin:0}
tr.needs-change td{background:rgba(243,156,18,.14)}
tr.needs-change td:first-child{box-shadow:inset 4px 0 0 var(--warning)}

.stat-strip{display:grid;grid-template-columns:1fr auto 1fr;gap:.75rem;align-items:center}
.stat{background:#eee0ff;border-radius:12px;padding:1rem 1.25rem;text-align:center}
.stat .lbl{font-size:0.875rem;color:var(--accent-dark);font-weight:600}
.stat .num{font-size:2.25rem;font-weight:700;color:var(--accent-dark);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:.25rem}
.stat .sub{font-size:0.75rem;color:var(--muted);margin-top:.35rem;font-variant-numeric:tabular-nums}
.stat-arrow{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat-arrow svg{width:32px;height:32px}
@media(max-width:520px){.stat-strip{grid-template-columns:1fr}.stat-arrow{transform:rotate(90deg);margin:0 auto}}
.tk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.tk-card{position:relative;border:1px solid rgba(0,0,0,.15);border-radius:12px;padding:1rem 1rem 1rem 2.9rem;background:#fff;box-shadow:0 3px 1px -2px rgba(0,0,0,.2),0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12)}
.tk-card h4{margin:0 0 .35rem;font-size:1rem}
.tk-card p{margin:0;font-size:0.875rem}
.tk-card .badge{position:absolute;left:.65rem;top:1rem;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:0.875rem;font-weight:700;display:flex;align-items:center;justify-content:center}

.stat{font-family:var(--mono);font-size:0.875rem;color:var(--fg);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:1rem;font-size:0.75rem;color:var(--muted);margin-top:.25rem}

.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.delta{font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}

table{border-collapse:collapse;width:100%;font-size:0.875rem}

<div class="wrap">
  <header>
    <div><h1>Detect the Disappearing Data</h1></div>
  </header>
  <nav class="steps" id="steps" aria-label="Progress"></nav>
  <main id="main"></main>
</div>
<footer id="footer"><div class="wrap"><button class="footer-btn secondary" id="prev"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Previous</button><span class="hint" id="hint"></span><button class="footer-btn" id="next"><span id="nextLabel">Next</span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button></div></footer>

<script>
/* ---------- data ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function normal(r,m,s){let u=1-r(),v=r();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function mean(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN}
function build(seed,nPer,ctrl,trt,dropper){const r=mulberry32(seed);const subs=[];
  for(let i=0;i<nPer;i++)subs.push(Object.assign({id:'C'+(i+1),arm:'control',dropped:false,reason:null,kind:null},ctrl(r,i)));

    h+=`</div>`;
    if(!q.submitted)h+=`<div class="row" style="margin-top:1rem;justify-content:flex-end"><button class="btn" data-act="submitq" ${ready?'':'disabled'}>Submit</button></div>`;
    return h},
  takeaways(){const P=PATHS[S.path],subs=S.path==='humans'?DATA.mnar:DATA[S.path];const b=stats(subs,false),a=stats(subs,true);
    const lost=subs.filter(d=>d.dropped).length,lostT=subs.filter(d=>d.dropped&&d.arm==='treatment').length;const grew=a.diff>b.diff;
    const fmt=v=>(v>=0?'+':'')+v.toFixed(1);
    return `<h2>Takeaways</h2>
    <div class="takeaway"><h3>Takeaway: Random loss is mostly harmless. Loss tied to treatment or outcome is not.</h3><div class="body"><p style="margin:0">The question to ask of any study with attrition is not how many were lost, but whether the ones lost differ from the ones kept.</p></div></div>
    <h3 class="tk-h">What you saw</h3>
    <p style="margin:0 0 .75rem">${lost} of ${subs.length} ${P.unit} dropped out, ${lostT} of them from the ${P.arms[1]} group. Here is what that did to the difference between the two group means.</p>
    <div class="stat-strip"><div class="stat"><div class="lbl">If no one had dropped out</div><div class="num">${fmt(b.diff)}</div><div class="sub">${P.arms[1]} ${b.mt.toFixed(1)} vs. ${P.arms[0]} ${b.mc.toFixed(1)}</div></div><div class="stat-arrow"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 11v2h12l-5.5 5.5 1.42 1.42L19.84 12l-7.92-7.92L10.5 5.5 16 11z"/></svg><span>${grew?'increased':'decreased'}</span></div><div class="stat"><div class="lbl">After attrition (what you observed)</div><div class="num">${fmt(a.diff)}</div><div class="sub">${P.arms[1]} ${a.mt.toFixed(1)} vs. ${P.arms[0]} ${a.mc.toFixed(1)}</div></div></div>
    <p class="small muted" style="margin:.5rem 0 0">Same study, same ${P.unit}. The only thing that changed is who was left to measure, and nothing in the final figure said so.</p>
    <h3 class="tk-h">What went wrong</h3>
    <div class="tk-grid">${P.lessons.map(t=>`<div class="tk-card lesson"><p>${t}</p></div>`).join('')}</div>
    <h3 class="tk-h">How to prevent it</h3>
    <div class="tk-grid">${P.prevent.map((x,i)=>`<div class="tk-card"><span class="badge" aria-hidden="true">${i+1}</span><h4>${x.t}</h4><p>${x.d}</p></div>`).join('')}</div>`},
};

/* ---------- render ---------- */
function canContinue(){const k=stepList()[S.step].k;
  if(k==='choose')return !!S.path;
  if(k==='attrition')return S.lab.revealed&&S.lab.obs.q1!=null&&S.lab.obs.q2!=null;
  if(k==='log')return S.lab.checked&&DATA[S.path].filter(d=>d.dropped).every(d=>S.lab.sort[d.id]===d.kind);
  if(k==='classify')return S.human.checked&&DATA.mnar.filter(d=>d.dropped).every(d=>S.human.sort[d.id]===d.kind);
  if(k==='questions')return !!S.q.submitted;
  return k!=='congrats'}
function hintFor(){const k=stepList()[S.step].k;
  if(k==='choose'&&!S.path)return 'Pick a subject type to continue.';
  if(k==='attrition'&&!canContinue())return S.lab.revealed?'Answer both questions about the observed result.':'Answer the questions about the ideal result, then reveal what happened.';
  if(k==='log'&&!canContinue())return 'Sort every row and check your calls. All rows must match to continue.';
  if(k==='classify'&&!canContinue())return 'Classify every participant who left and check your calls. All rows must match to continue.';
  if(k==='questions'&&!canContinue())return 'Answer both questions to continue.';
  return ''}
function renderZoom(){let z=document.getElementById('zoom');if(!S.zoom){if(z)z.remove();return}
  const subs=S.path==='humans'?DATA.mnar:DATA[S.path];const after=S.zoom==='obs';
  if(!z){z=document.createElement('div');z.id='zoom';document.body.appendChild(z)}
  const other=after?'ideal':'obs';
  z.innerHTML=`<div class="zoom-overlay" data-zoomclose="1" role="dialog" aria-modal="true" aria-label="Enlarged chart"><div class="zoom-box"><div class="zoom-bar"><span class="small muted">${after?'2 of 2':'1 of 2'}</span><button class="zoom-close" data-act="closezoom" aria-label="Close"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div>
    <div class="zoom-body"><button class="zoom-nav" data-zoomto="${other}" aria-label="${after?'Show the data without any attrition':'Show what you actually observe'}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
    <div class="charts" style="flex:1;min-width:0">${chartCard(after?'What you actually observe':'The data without any attrition',subs,{after})}</div>
    <button class="zoom-nav" data-zoomto="${other}" aria-label="${after?'Show the data without any attrition':'Show what you actually observe'}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button></div>${legend(false,after)}</div></div>`}
function render(){const list=stepList();S.step=Math.min(S.step,list.length-1);const k=list[S.step].k;
  const untracked=k==='intro'||k==='congrats';
  const tracked=list.filter(s=>s.k!=='intro'&&s.k!=='congrats');
  document.getElementById('steps').innerHTML=untracked?'':tracked.map((s,i)=>{const j=list.indexOf(s);return `<span class="${j===S.step?'on':j<S.step?'done':''}">${i+1}. ${s.l}</span>`}).join('');
  document.getElementById('steps').hidden=untracked;
  SEEN=new Set();document.getElementById('main').innerHTML=PAGES[k]();
  document.getElementById('prev').disabled=S.step===0;
  const next=document.getElementById('next');next.disabled=!canContinue();
  document.getElementById('nextLabel').textContent=k==='takeaways'?'Complete Activity':'Next';
  document.getElementById('footer').hidden=k==='congrats';document.body.classList.toggle('no-footer',k==='congrats');
  document.getElementById('hint').textContent=hintFor();
  renderZoom();save();if(render.lastStep!==S.step)window.scrollTo({top:0});render.lastStep=S.step}

(function(){const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);let cur=null;
  function show(el){cur=el;tip.textContent=el.dataset.tip;tip.classList.add('show');const r=el.getBoundingClientRect();tip.style.left='0px';tip.style.top='0px';const w=tip.offsetWidth,h=tip.offsetHeight;
    let x=r.left,y=r.bottom+6;if(x+w>window.innerWidth-8)x=Math.max(8,window.innerWidth-8-w);if(y+h>window.innerHeight-8)y=r.top-6-h;tip.style.left=x+'px';tip.style.top=y+'px'}
  function hide(){cur=null;tip.classList.remove('show')}
  document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)show(t);else if(cur)hide()});
  document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)show(t)});
  document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('.term'))hide()});
  document.addEventListener('scroll',()=>{if(cur)show(cur)},true);
})();
document.addEventListener('toggle',e=>{if(e.target.id==='studyDetails'){S.lab.studyOpen=e.target.open;save()}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.zoom){S.zoom=null;renderZoom()}
  if(S.zoom&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){S.zoom=S.zoom==='obs'?'ideal':'obs';renderZoom()}
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.zoom){e.preventDefault();S.zoom=e.target.dataset.zoom;renderZoom()}});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.open)return;S.q[t.dataset.open]=t.value;save();
  const ready=S.q.c.trim().length>0&&S.q.r.trim().length>0;const b=document.querySelector('[data-act="submitq"]');if(b)b.disabled=!ready});
document.addEventListener('click',e=>{
  const zc=e.target.closest('[data-zoomclose]');if(zc&&e.target===zc){S.zoom=null;renderZoom();return}
  const zb=e.target.closest('[data-zoom]');if(zb){S.zoom=zb.dataset.zoom;renderZoom();return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.hint){const[k,op]=b.dataset.hint.split(':');S.lab.hint=op==='open';render();return}
  if(b.dataset.act==='closezoom'){S.zoom=null;renderZoom();return}
  if(b.dataset.zoomto){S.zoom=b.dataset.zoomto;renderZoom();return}
  if(b.dataset.path){S.path=b.dataset.path;S.salt=Math.floor(Math.random()*1e9);S.lab={ideal:{q1:null,q2:null},revealed:false,obs:{q1:null,q2:null},sort:{},checked:false,studyOpen:true};S.human={sort:{},checked:false};S.q={c:'',r:'',submitted:false};render();return}
  if(b.dataset.pick){const[name,i]=b.dataset.pick.split(':');const idx=+i;
    if(name==='i1'){if(S.lab.ideal.q1==null)S.lab.ideal.q1=idx}
    else if(name==='i2'){if(S.lab.ideal.q2==null)S.lab.ideal.q2=idx}
    else if(name==='o1'){if(S.lab.obs.q1==null)S.lab.obs.q1=idx}
    else if(name==='o2'){if(S.lab.obs.q2==null)S.lab.obs.q2=idx}
    render();return}
  if(b.dataset.act){const[a,key]=b.dataset.act.split(':');
    if(a==='submitq'){S.q.submitted=true;render();return}
    if(a==='reveal'){S.lab.revealed=true;S.lab.studyOpen=false;render();window.scrollTo({top:0,behavior:'smooth'});return}
    if(a==='sort'){if(S.path==='humans')S.human.checked=true;else S.lab.checked=true}
    if(a==='restart'){S.path=null;S.step=1;S.salt=Math.floor(Math.random()*1e9)}
    if(a==='prevpage'){S.step--}
    if(a==='home'){S.path=null;S.step=0}
    render();return}
  if(b.dataset.sort){const[id,kind]=b.dataset.sort.split(':');(S.path==='humans'?S.human:S.lab).sort[id]=kind;render();return}
  if(b.id==='next'&&canContinue()){S.step++;render()}
  if(b.id==='prev'&&S.step>0){S.step--;render()}
});
render();
</script>
