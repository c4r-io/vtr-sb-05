<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detect the Disappearing Data</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
<style>
/* Layout: C4R activity shell. White page, a slim header with a step bar, one centered column of cards, prev/next footer. */
:root{
  --bg:#ffffff; --fg:#202020; --muted:#757575; --border:#E0E0E0; --panel:#F3F3F3;
  --accent:#6F00FF; --accent-dark:#5700CA; --accent-fill:#F3EBFF;
  --orange:#FF5A00; --green:#00C802;
  --success:#007800; --success-fill:#e0efe0; --warning:#EA7134; --warning-fill:#fceee7; --error:#d00000; --error-fill:#f9e0e0; --info:#1859D7;
  --control:#757575; --treat:#6F00FF;
  --unit:#0082FF; --unit-fill:#e0f0ff; --takeaway:#1859D7; --takeaway-fill:#e3ebfa; --drop:#FF5A00;
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:"JetBrains Mono",Menlo,Monaco,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 6rem}
.wrap{max-width:880px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.5rem 1rem;padding-block:1.25rem .75rem;border-bottom:1px solid var(--border)}
header h1{font-size:1.5rem;margin:0;font-weight:800}
header .lesson{font-size:0.875rem;color:var(--muted)}
.steps{display:flex;gap:.375rem;flex-wrap:wrap;padding-block:.75rem 0;font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.steps span{padding:.25rem .5rem;border-radius:4px;border:1px solid var(--border)}
.steps span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.steps span.done{border-color:var(--accent);color:var(--accent)}
main{padding-block:1.5rem}
h2{font-size:1.375rem;margin:0 0 .5rem;font-weight:700;text-wrap:balance}
h3{font-size:1.25rem;margin:0 0 .5rem;font-weight:700}
p{margin:0 0 .75rem}
.lede{font-size:1.2rem;color:var(--fg)}
.muted{color:var(--muted)}
.small{font-size:0.875rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.hint-wrap{margin:1rem 0 .25rem}
.hint-pill{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1.25rem;border-radius:24px;border:1.5px solid #FFA800;background:#fff3e0;color:var(--fg);font:inherit;font-size:0.875rem;cursor:pointer;transition:all .2s ease;user-select:none}
.hint-pill:hover{background:#FFD480;transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,168,0,.25)}
.hint-pill svg,.hint-card .bulb{width:24px;height:24px;color:#FFA800;flex:none}
.hint-center{display:flex;justify-content:center}
.hint-card{position:relative;background:#fff3e0;border-left:4px solid #FFA800;border-radius:4px;padding:1rem 2.5rem 1rem 1rem}
.hint-card .head{display:flex;align-items:center;gap:.4rem;margin-bottom:.25rem;font-weight:500}
.hint-card p{margin:0}
.hint-close{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;background:none;cursor:pointer;color:#757575;display:flex;align-items:center;justify-content:center;border-radius:50%;padding:0}
.hint-close:hover{color:var(--fg);background:rgba(0,0,0,.05)}
.hint-close svg{width:18px;height:18px}
.zoomable{cursor:zoom-in;border-radius:8px}
.zoomable:hover .chart.card{box-shadow:0 4px 12px rgba(0,0,0,.15)}
.zoomable:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zoom-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px));z-index:100}
.zoom-box{background:#fff;border-radius:12px;width:min(1180px,100%);max-height:90vh;overflow:auto;padding:.75rem 1rem 1.25rem;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.zoom-box .charts{grid-template-columns:1fr}
.zoom-box .chart.card svg{width:100%;height:auto}
.zoom-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.zoom-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid #E0E0E0;border-radius:50%;cursor:pointer;color:var(--fg);padding:0}
.zoom-close svg{width:20px;height:20px}
.zoom-close:hover{background:#F3F3F3}
.zoom-body{display:flex;align-items:center;gap:.5rem}
.zoom-nav{flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid #E0E0E0;border-radius:50%;cursor:pointer;color:var(--fg);padding:0}
.zoom-nav svg{width:24px;height:24px}
.zoom-nav:hover{background:#F3F3F3;border-color:var(--accent);color:var(--accent)}
.ta{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;line-height:1.5;padding:.75rem;border:1px solid #c4c4c4;border-radius:4px;background:#fff;color:var(--fg);resize:vertical;min-height:110px}
.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.resp{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--takeaway);background:var(--takeaway-fill);box-shadow:0 3px 1px -2px rgba(0,0,0,.2),0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12)}

.resp .body{flex:1;min-width:0;padding:1rem;white-space:pre-wrap;font-size:0.875rem;line-height:1.5}
.th-help{display:inline-flex;align-items:center;gap:.4rem;position:relative;text-transform:none;letter-spacing:0}
.th-help::before{content:"Decision";text-transform:uppercase;letter-spacing:.04em}
.help-icon{display:inline-flex;border:0;font-weight:400;cursor:help;color:inherit;vertical-align:middle;text-decoration:none}
.help-icon svg{width:16px;height:16px}
.help-icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:50%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{border:1px solid rgba(0,0,0,.15);border-radius:12px;padding:1rem;background:var(--bg)}
.panel{background:var(--panel);border-radius:6px;padding:1rem}
.btn{font:inherit;font-size:1rem;font-weight:400;padding:10px 20px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer;line-height:1.5}
.btn:hover{background:var(--accent-dark)}
.btn:disabled{background:#C4C4C4;color:#fff;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-fill)}
.btn:focus-visible,.choice:focus-visible,.opt:focus-visible,.term:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
/* Large choice cards (path picker), after the monolith's LargeChoiceCard */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.choice{position:relative;text-align:left;font:inherit;color:var(--fg);background:#fff;border:2px solid #c4c4c4;border-radius:6px;padding:1rem 2.5rem 1rem 1rem;cursor:pointer;transition:border-color .15s,background-color .15s,transform .15s,box-shadow .15s}
.choice:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-fill)}
.choice .glyph{position:absolute;top:1rem;right:1rem;width:20px;height:20px;border-radius:50%;border:2px solid #767676}
.choice[aria-pressed="true"] .glyph{border-color:var(--accent)}
.choice[aria-pressed="true"] .glyph::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.choice .icon{display:block;width:40px;height:40px;margin-bottom:.75rem;color:var(--accent)}
.choice .icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.eyebrow-inline{display:block;font-size:0.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:.25rem}
.choice .eyebrow{font-size:0.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:.25rem}
.choice h3{margin-bottom:.375rem}
.choice p{font-size:0.875rem;color:var(--muted);margin:0}
.choice ul{font-size:0.875rem;margin:.5rem 0 0;padding-left:1.1rem;color:var(--fg)}
/* Option rows (forced choice) */
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt.check .box{flex:none;width:18px;height:18px;border:2px solid #7F7F7F;border-radius:3px;margin-top:2px;position:relative;background:#fff;color:var(--accent)}
.opt.check.correct .box{color:var(--success)}.opt.check.wrong .box{color:var(--error)}
.opt.check[aria-checked="true"] .box{border-color:currentColor;background:currentColor}
.opt.check[aria-checked="true"] .box::after{content:"";position:absolute;left:4px;top:0px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt.check[disabled]{cursor:default;opacity:1}
.opt-why{display:block;font-size:0.875rem;color:var(--muted);margin-top:.25rem;font-weight:400}
.opt.correct .opt-why{color:var(--success)}.opt.wrong .opt-why{color:var(--error)}
.opt{display:flex;gap:.75rem;align-items:flex-start;text-align:left;font:inherit;color:var(--fg);background:#fff;border:2px solid #7F7F7F;border-radius:9px;padding:.7rem .9rem;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-fill)}
.opt .dot{flex:none;width:18px;height:18px;margin-top:.15rem;border-radius:50%;border:2px solid #767676;position:relative}
.opt[aria-pressed="true"] .dot{border-color:var(--accent)}
.opt[aria-pressed="true"] .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--success);background:var(--success-fill)}
.opt.wrong{border-color:var(--error);background:var(--error-fill)}
.instr{position:relative;overflow:hidden;background:#eee0ff;border:1px solid rgba(0,0,0,.15);border-radius:12px;box-shadow:0 3px 1px -2px rgba(0,0,0,.2),0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12)}
.instr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:24px;background:var(--accent)}
.instr .inner{position:relative;background:#eee0ff;margin-left:6px;border-top-left-radius:12px;border-bottom-left-radius:12px;padding:16px 16px 16px 10px;display:flow-root}
.instr h2{font-size:1.375rem;margin:0 0 .5rem}
.instr p:last-child{margin-bottom:0}
.feedback{border-left:4px solid var(--info);background:var(--takeaway-fill);padding:.75rem 1rem;border-radius:0 8px 8px 0}
.feedback.good{border-left-color:var(--success);background:var(--success-fill)}
.feedback.bad{border-left-color:var(--error);background:var(--error-fill)}
.feedback p:last-child{margin:0}
/* Charts */
.charts{display:grid;grid-template-columns:1fr;gap:1rem}
.charts.pair{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:stretch}
.charts.pair .zoomable{display:flex}
.charts.pair .chart.card{flex:1;display:flex;flex-direction:column}
details.prior{margin-top:1rem;border:1px solid #E0E0E0;border-radius:12px;background:#fff;overflow:hidden}
details.prior summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.5rem .5625rem .5rem 1rem;font-weight:700;font-size:1.167rem;line-height:1.3;color:var(--fg);user-select:none;transition:background-color .2s}
details.prior summary::-webkit-details-marker{display:none}
details.prior summary:hover{background:#F3F3F3}
details.prior summary .chev{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;border:1.5px solid #E0E0E0;display:inline-flex;align-items:center;justify-content:center;transition:background-color .2s}
details.prior summary:hover .chev{background:#E0E0E0}
details.prior summary .chev svg{width:20px;height:20px;fill:#4a4a4a;transition:transform .2s}
details.prior[open] summary .chev svg{transform:rotate(180deg)}
details.prior summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
details.prior .content{padding:1rem}
details.prior .content .study{margin-bottom:0}
.scenario{border-top:1px solid var(--border);padding-top:1rem;margin-top:1rem}
.chart{min-width:0}
.chart h4{font-size:1.125rem;margin:0 0 .25rem;font-weight:700;color:var(--fg)}
.chart svg{width:100%;height:auto;display:block}
.chart{padding-bottom:1rem}
.chart-row{display:flex;gap:1rem;align-items:center}
.chart-row .plot{flex:1 1 0;min-width:0}
.stat-tbl{flex:0 0 auto;width:auto;border-collapse:collapse;font-size:0.8rem;font-variant-numeric:tabular-nums}
.stat-tbl th,.stat-tbl td{padding:.3rem .5rem;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.stat-tbl th{font-size:0.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stat-tbl td i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.4rem;vertical-align:middle}
.stat-tbl tr.diff td{background:#eee0ff;color:var(--accent-dark);font-weight:600;border-bottom:0}
.stat-tbl tr.diff td:first-child{border-radius:6px 0 0 6px}.stat-tbl tr.diff td:last-child{border-radius:0 6px 6px 0}
.chart-row.stacked{flex-direction:column;align-items:stretch}.chart-row.stacked .stat-tbl{width:100%}
@media(max-width:640px){.chart-row{flex-direction:column;align-items:stretch}.stat-tbl{width:100%}}
.diff-banner{background:#eee0ff;color:var(--accent-dark);font-weight:600;padding:.5rem 1rem;margin:.5rem -1rem 0;border-radius:0 0 6px 6px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.25rem 1rem;font-variant-numeric:tabular-nums}
.diff-banner .n{font-weight:400;font-size:0.875rem;color:var(--fg)}
.study{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;margin-bottom:1rem}
.study dt{font-weight:600;color:var(--accent);text-transform:uppercase;font-size:0.875rem;letter-spacing:.04em;padding-top:.15rem}
.study dd{margin:0}
tr.needs-change td{background:rgba(243,156,18,.14)}
tr.needs-change td:first-child{box-shadow:inset 4px 0 0 var(--warning)}
.takeaway{background:var(--takeaway-fill);border-radius:12px;border:1px solid rgba(0,0,0,.15);box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden;margin-bottom:1rem}
.takeaway h3{margin:0;background:var(--takeaway);color:#fff;padding:.75rem 1rem;font-size:1.25rem}
.takeaway .body{padding:1rem;display:flow-root}
.takeaway ul{margin:0;padding-left:1.2rem}
.takeaway li{margin-bottom:.5rem}
.takeaway li:last-child{margin-bottom:0}
.tk-h{margin:1.5rem 0 .75rem;font-size:1rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat-strip{display:grid;grid-template-columns:1fr auto 1fr;gap:.75rem;align-items:center}
.stat{background:#eee0ff;border-radius:12px;padding:1rem 1.25rem;text-align:center}
.stat .lbl{font-size:0.875rem;color:var(--accent-dark);font-weight:600}
.stat .num{font-size:2.25rem;font-weight:700;color:var(--accent-dark);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:.25rem}
.stat .sub{font-size:0.75rem;color:var(--muted);margin-top:.35rem;font-variant-numeric:tabular-nums}
.stat-arrow{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat-arrow svg{width:32px;height:32px}
@media(max-width:520px){.stat-strip{grid-template-columns:1fr}.stat-arrow{transform:rotate(90deg);margin:0 auto}}
.tk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.tk-card{position:relative;border:1px solid rgba(0,0,0,.15);border-radius:12px;padding:1rem 1rem 1rem 2.9rem;background:#fff;box-shadow:0 3px 1px -2px rgba(0,0,0,.2),0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12)}
.tk-card h4{margin:0 0 .35rem;font-size:1rem}
.tk-card p{margin:0;font-size:0.875rem}
.tk-card .badge{position:absolute;left:.65rem;top:1rem;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:0.875rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.tk-card.lesson{padding-left:1rem;border-left:6px solid var(--drop)}
.tk-card.lesson p{font-size:1rem}
.tk-card.lesson ul{margin:0;padding-left:1.1rem}
.tk-card.lesson li+li{margin-top:.35rem}
.stat{font-family:var(--mono);font-size:0.875rem;color:var(--fg);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;font-size:0.75rem;color:var(--muted);margin-top:.75rem;padding-top:.6rem;border-top:1px solid var(--border)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chart-note{margin:.4rem 0 0}
.delta{font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
/* Exclusion log table */
table{border-collapse:collapse;width:100%;font-size:0.875rem}
th,td{text-align:center;padding:.45rem .5rem;border-bottom:1px solid var(--border);vertical-align:middle}
td.txt{text-align:left}
th{font-size:0.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl{overflow:visible}
.tbl td{white-space:normal}
.tbl .seg{flex-wrap:nowrap;white-space:nowrap}
.tbl td:last-child{white-space:nowrap;width:1%}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:0.75rem;padding:.3rem .55rem;border:0;background:#fff;color:var(--fg);cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.pill{display:inline-block;font-size:0.75rem;padding:.1rem .5rem;border-radius:999px;border:1px solid var(--border)}
.pill.treatment{color:var(--accent);border-color:var(--accent)}
.pill.control{color:var(--control);border-color:var(--control)}
/* Hover definitions */
.term{text-decoration:underline dotted;text-decoration-color:var(--accent);text-underline-offset:2px;cursor:help;color:inherit;font-weight:inherit}
#tip{position:fixed;z-index:1000;width:max-content;max-width:min(300px,calc(100vw - 32px));background:#202020;color:#fff;font-weight:400;font-size:0.875rem;line-height:1.43;padding:8px 12px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:pre-line;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(0 4px 12px rgba(32,32,32,.3))}
#tip.show{opacity:1}

#tip.above::after{top:100%;border-top:13px solid #202020}
#tip.below::after{bottom:100%;border-bottom:13px solid #202020}
/* Round tabs (human path) */
.tabs{display:flex;gap:.375rem;flex-wrap:wrap;margin-bottom:1rem}
.tab{font:inherit;font-size:0.875rem;font-weight:600;padding:.4rem .8rem;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--muted)}
.tab.on{border-color:var(--accent);color:var(--accent);background:var(--accent-fill)}
.tab.locked{opacity:.5}
/* Footer nav */
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.75rem calc(.75rem + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem}
footer .hint{font-size:0.875rem;color:var(--muted)}
.proto{font-size:0.75rem;color:var(--muted);border:1px dashed var(--border);border-radius:4px;padding:.25rem .5rem}
ul.tight{margin:.25rem 0 .75rem;padding-left:1.2rem}
ul.tight li{margin-bottom:.35rem}
.intro-accent{border-radius:12px;border:1px solid rgba(0,0,0,.15);background:var(--unit-fill);box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden;margin-bottom:1rem}

.intro-panel{border-radius:12px;border:1px solid rgba(0,0,0,.15);background:#fff;padding:12px 16px;margin-bottom:1rem}

<script>
/* ---------- data ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function normal(r,m,s){let u=1-r(),v=r();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function mean(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN}
function build(seed,nPer,ctrl,trt,dropper){const r=mulberry32(seed);const subs=[];
  for(let i=0;i<nPer;i++)subs.push(Object.assign({id:'C'+(i+1),arm:'control',dropped:false,reason:null,kind:null},ctrl(r,i)));
  for(let i=0;i<nPer;i++)subs.push(Object.assign({id:'T'+(i+1),arm:'treatment',dropped:false,reason:null,kind:null},trt(r,i)));
  dropper(r,subs);return subs}
function pickRandom(r,list,k){const a=list.slice(),out=[];while(out.length<k&&a.length)out.push(a.splice(Math.floor(r()*a.length),1)[0]);return out}
function lowest(list,k){return list.slice().sort((a,b)=>a.x-b.x).slice(0,k)}
function sd(a){if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1))}
function highest(list,k){return list.slice().sort((a,b)=>b.x-a.x).slice(0,k)}
function stats(s,after){const f=d=>!after||!d.dropped;const c=s.filter(d=>d.arm==='control'&&f(d)).map(d=>d.x),t=s.filter(d=>d.arm==='treatment'&&f(d)).map(d=>d.x);return{nc:c.length,nt:t.length,mc:mean(c),mt:mean(t),sc:sd(c),st:sd(t),diff:mean(t)-mean(c)}}
function ageAdj(s){let est=0;for(const f of[d=>d.age<55,d=>d.age>=55]){const all=s.filter(f),w=all.length/s.length;const c=all.filter(d=>d.arm==='control'&&!d.dropped).map(d=>d.x),t=all.filter(d=>d.arm==='treatment'&&!d.dropped).map(d=>d.x);est+=w*(mean(t)-mean(c))}return est}

const DATA={
  mice:build(11,16,r=>({x:clamp(normal(r,50,10),5,95)}),r=>({x:clamp(normal(r,57,10),5,95)}),(r,s)=>{
    const c=s.filter(d=>d.arm==='control'),t=s.filter(d=>d.arm==='treatment');
    pickRandom(r,c,2).forEach((d,i)=>{d.dropped=true;d.reason=['Excluded: malocclusion','Failed surgery'][i];d.kind='benign'});
    lowest(t,4).forEach((d,i)=>{d.dropped=true;d.reason=['Died before endpoint','Reached humane endpoint','Died before endpoint','Reached humane endpoint'][i];d.kind='suspect'});
    pickRandom(r,t.filter(d=>!d.dropped),1).forEach(d=>{d.dropped=true;d.reason='Failed surgery';d.kind='benign'})}),
  cells:build(71,24,r=>({x:clamp(normal(r,50,8),5,95)}),r=>{const resp=r()<0.35;return{resp,x:clamp(resp?normal(r,80,6):normal(r,53,8),5,95)}},(r,s)=>{
    const c=s.filter(d=>d.arm==='control'),t=s.filter(d=>d.arm==='treatment');
    pickRandom(r,c,2).forEach((d,i)=>{d.dropped=true;d.reason=['Contaminated sample','Failed culture'][i];d.kind='benign'});
    highest(t,7).forEach((d,i)=>{d.dropped=true;d.reason=['Failed imaging QC: could not segment neurites','Excluded: overconfluent','Failed imaging QC: could not segment neurites','Failed imaging QC: could not segment neurites','Excluded: overconfluent','Failed imaging QC: could not segment neurites','Excluded: overconfluent'][i];d.kind='suspect'});
    pickRandom(r,t.filter(d=>!d.dropped),1).forEach(d=>{d.dropped=true;d.reason='Excluded: edge well';d.kind='benign'})}),
  mcar:build(29,30,r=>({x:clamp(normal(r,40,12),2,98)}),r=>({x:clamp(normal(r,48,12),2,98)}),(r,s)=>{
    const c=s.filter(d=>d.arm==='control'),t=s.filter(d=>d.arm==='treatment');const R=['Moved away','Lost contact','Withdrew (unrelated)','Moved away','Lost contact'];
    pickRandom(r,c,5).forEach((d,i)=>{d.dropped=true;d.reason=R[i];d.kind='benign'});
    pickRandom(r,t,5).forEach((d,i)=>{d.dropped=true;d.reason=R[i];d.kind='benign'})}),
  mar:build(47,30,r=>{const age=Math.round(35+r()*40);return{age,x:clamp(normal(r,40,10),2,98)}},r=>{const age=Math.round(35+r()*40);return{age,x:clamp(48-0.8*(age-55)+normal(r,0,8),2,98)}},(r,s)=>{
    const c=s.filter(d=>d.arm==='control'),t=s.filter(d=>d.arm==='treatment');
    pickRandom(r,c,3).forEach(d=>{d.dropped=true;d.reason='Missed visits';d.kind='benign'});
    t.forEach(d=>{if(r()<(d.age>=60?0.8:0.06)){d.dropped=true;d.reason='Missed visits';d.kind='suspect'}})}),
  mnar:build(107,20,r=>{const age=Math.round(35+r()*40),sev=r();return{age,sev,x:clamp(normal(r,40,9),2,98)}},r=>{const age=Math.round(35+r()*40),sev=r();return{age,sev,x:clamp(52-0.45*(age-55)-24*(sev-0.5)+normal(r,0,7),2,98)}},(r,s)=>{
    const c=s.filter(d=>d.arm==='control'),t=s.filter(d=>d.arm==='treatment');
    const MC=['Moved out of the area','Changed phone number; could not be reached'];
    const MAR='Could not manage the monthly visits; travel too difficult';
    const MN=['Stopped attending. At a follow-up call, mentioned side effects. Side effects were not measured in this trial.','Stopped attending. No reason given.'];
    let mc=0,mn=0;
    pickRandom(r,c,1).forEach(d=>{d.dropped=true;d.kind='MCAR';d.reason=MC[mc++%MC.length]});
    c.filter(d=>!d.dropped).sort((a,b)=>b.age-a.age).slice(0,1).forEach(d=>{d.dropped=true;d.kind='MAR';d.reason=MAR});
    pickRandom(r,t,1).forEach(d=>{d.dropped=true;d.kind='MCAR';d.reason=MC[mc++%MC.length]});
    t.filter(d=>!d.dropped).sort((a,b)=>b.age-a.age).slice(0,3).forEach(d=>{d.dropped=true;d.kind='MAR';d.reason=MAR});
    t.filter(d=>!d.dropped).sort((a,b)=>b.sev-a.sev).slice(0,4).forEach(d=>{d.dropped=true;d.kind='MNAR';d.reason=MN[mn++%MN.length]})}),
};

const TIP={
  MCAR:'Missing completely at random: dropout is unrelated to anything about the subject or the study. The remaining sample is still a fair sample.',
  MAR:'Missing at random: dropout can be explained by variables you measured (age, baseline severity, site). Statistical adjustment using those variables can correct the bias.',
  MNAR:'Missing not at random (also called NMAR): dropout depends on something you did not measure, often the outcome itself. No adjustment from the data alone can fix it. A sensitivity analysis explores how these measures can impact your data.',
  sens:'Sensitivity analysis: re-run the analysis under different assumptions about what the missing values might have been and report how much the conclusion changes.',
  cc:'Complete-case analysis: analyze only the subjects who finished the study and ignore the dropouts.',
  SD:'Standard deviation (SD): quantifies the spread of individual values around the mean.',
  itt:'Intention to treat: analyze every subject in the group they were assigned to, whether or not they finished.',
};
const JARGON={
  'neurite':'Neurite: any projection (axon or dendrite) that extends from a neuron.',
  'overconfluent':'Overconfluent: cells have grown so dense that they cover the whole well and pile up, which changes their behavior and makes them impossible to measure reliably.',
  'segment':'Segment: have the imaging software trace each neurite as a separate object. When neurites form a dense tangle the software cannot tell them apart, so the well cannot be measured.',
  'imaging QC':'Imaging quality control (QC): a pre-set rule that rejects a well whose image cannot be measured reliably, for example because it is out of focus, too dense, too sparse, or based on other rationale listed in a lab protocol.',
  'edge well':'Edge well: a well on the outer rim of the plate. Edge wells evaporate and warm unevenly, so many protocols exclude them by default.',
  'contaminated':'Contaminated: bacteria, yeast, or mold got into the culture, so the well is discarded.',
  'MCAO':'MCAO: middle cerebral artery occlusion. A filament is threaded up the carotid artery to block the middle cerebral artery for a set time, producing an ischemic stroke.',
  'malocclusion':'Malocclusion: misaligned teeth. Rodent incisors grow continuously and when they do not meet properly the animal cannot eat and is excluded for welfare reasons.',
  'humane endpoint':'Humane endpoint: a pre-set point, such as weight loss or distress, at which an animal is removed from the study to prevent suffering.',
  'vehicle':'Vehicle: the solution the drug or compound is dissolved in, given on its own so the control group goes through the same procedure with an inactive solution.',
  'placebo':'Placebo: an inactive treatment made to look identical to the real one, so participants and staff cannot tell the groups apart.',
};
let SEEN=new Set();
function J(text){let out=text;for(const [k,v] of Object.entries(JARGON)){if(SEEN.has(k))continue;const re=new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');if(re.test(out)){SEEN.add(k);out=out.replace(re,m=>`<span class="term" tabindex="0" data-tip="${v}">${m}</span>`)}}return out}
function term(key,label,text){if(SEEN.has('tip:'+key))return label||key;SEEN.add('tip:'+key);return `<span class="term" tabindex="0" data-tip="${text||TIP[key]}">${label||key}</span>`}

    <div class="charts">${chartCard(allRight?'The real data with attrition, highlighting the possibly treatment-related dropouts':'The real data with attrition',subs,{after:true,flag:allRight})}</div>
    <p style="margin-top:1rem">For each entry, decide: could the treatment itself have made this dropout more likely? If not, it is unrelated to treatment.</p>
    <div class="tbl card"><table><thead><tr><th>Group</th><th>Note</th><th><span class="th-help">${helpBtn('lab',`Not treatment-related: the dropout would have occurred no matter which group the sample or subject was in. This could include a failed surgery, contamination, or a protocol exclusion.\n\nPossibly treatment-related: the treatment itself could have caused this kind of loss, such as a death or a QC failure that depends on how the subject responded. If multiple of these losses pile up, they can skew the results and obscure a real result related to the treatment.`)}</span></th></tr></thead><tbody>${lost.map(d=>{const bad=st.checked&&st.sort[d.id]!==d.kind;return `<tr class="${bad?'needs-change':''}"><td><span class="pill ${d.arm}">${d.arm==='control'?P.arms[0]:P.arms[1]}</span></td><td class="txt">${J(d.reason)}</td><td><span class="seg"><button data-sort="${d.id}:benign" aria-pressed="${st.sort[d.id]==='benign'}" ${allRight?'disabled':''}>Not treatment-related</button><button data-sort="${d.id}:suspect" aria-pressed="${st.sort[d.id]==='suspect'}" ${allRight?'disabled':''}>Possibly treatment-related</button></span></td></tr>`}).join('')}</tbody></table></div>`;
    const done=lost.every(d=>st.sort[d.id]);
    if(!allRight){h+=`<div class="row" style="margin-top:1rem"><button class="btn" data-act="sort" ${done?'':'disabled'}>${st.checked?'Check again':'Check my answers'}</button>${done?'':'<span class="small muted">Make a decision on every row.</span>'}</div>`;
      if(st.checked)h+=`<div class="feedback bad" style="margin-top:1rem"><p style="margin:0"><strong>${wrong.length} ${wrong.length===1?'row is':'rows are'} incorrect. Try again!</strong> Hint: ask yourself, could the ${P.tx} itself make this reason more likely?</p></div>`}
    else{const sus=lost.filter(d=>d.kind==='suspect');const susT=sus.filter(d=>d.arm==='treatment').length;
      h+=`<div class="feedback good" style="margin-top:1rem"><p><strong>All answers are correct!</strong> ${J(P.twist)}</p><p style="margin:0">${P.twistAfter.replace('{t}',susT).replace('{n}',sus.length)}</p></div>`}
    return h},
  classify(){const P=PATHS.humans,subs=DATA.mnar,st=S.human;const lost=subs.filter(d=>d.dropped);
    const wrong=lost.filter(d=>st.sort[d.id]!==d.kind);const allRight=st.checked&&wrong.length===0;
    const n=k=>lost.filter(d=>d.kind===k).length;
    let h=`
    <div class="instr" style="margin-bottom:1rem"><div class="inner"><h2>The data alone can't tell you why someone left</h2><p>Ten participants dropped out and are shown on the chart below. The reason these participants left can influence how you handle the data.</p><p>Let's take a moment to identify different cases of missing data!</p></div></div>
    <div class="charts">${chartCard(allRight?'The real data with attrition, highlighting the dropouts tied to something unrecorded (MNAR)':'The real data with attrition',subs,{after:true,flag:allRight})}</div>
    <div class="card" style="margin:1rem 0"><table><thead><tr><th>Why they dropped out</th><th>Type</th><th>What you can do</th></tr></thead><tbody>
      <tr><td class="txt">Dropped out for reasons unrelated to the study, such as moving away</td><td>${term('MCAR')}</td><td class="txt">Nothing to fix. Analyze the people who stayed.</td></tr>
      <tr><td class="txt">Dropped out for a reason you recorded, such as age or baseline severity</td><td>${term('MAR')}</td><td class="txt">Adjust for that variable.</td></tr>
      <tr><td class="txt">Dropped out for a reason you never recorded, such as unexpected side effects</td><td>${term('MNAR')}</td><td class="txt">No adjustment can fix it. Run a ${term('sens','sensitivity analysis')}.</td></tr>
    </tbody></table></div>
    <p style="margin-top:1rem">Every participant who dropped out of the study has a note detailing the reason why. Age was recorded at enrollment. For each one, decide which kind of dropout it is. This will help you decide how to handle these data for analyses!</p>
    <div class="tbl card"><table><thead><tr><th>Group</th><th>Age</th><th>Note</th><th><span class="th-help">${helpBtn('hum',`MCAR: the reason doesn't have to do with the trial, the drug, or how the person was doing.\n\nMAR: the reason is related to a variable that the trial recorded, such as age.\n\nMNAR: the reason is associated with something the trial never recorded or considered, such as an unexpected side effect, or no reason was recorded at all.`)}</span></th></tr></thead><tbody>${lost.map(d=>{const bad=st.checked&&st.sort[d.id]!==d.kind;return `<tr class="${bad?'needs-change':''}"><td><span class="pill ${d.arm}">${d.arm==='control'?P.arms[0]:P.arms[1]}</span></td><td class="stat">${d.age}</td><td class="txt">${J(d.reason)}</td><td><span class="seg">${['MCAR','MAR','MNAR'].map(k=>`<button data-sort="${d.id}:${k}" aria-pressed="${st.sort[d.id]===k}" ${allRight?'disabled':''}>${k}</button>`).join('')}</span></td></tr>`}).join('')}</tbody></table></div>`;
    const done=lost.every(d=>st.sort[d.id]);
    if(!allRight){h+=`<div class="row" style="margin-top:1rem"><button class="btn" data-act="sort" ${done?'':'disabled'}>${st.checked?'Check again':'Check my answers'}</button>${done?'':'<span class="small muted">Make a decision on every row.</span>'}</div>`;
      if(st.checked)h+=`<div class="feedback bad" style="margin-top:1rem"><p style="margin:0"><strong>${wrong.length} ${wrong.length===1?'row is':'rows are'} incorrect. Try again!</strong> Hint: ask yourself, is the reason unrelated to the study, tied to something the trial recorded, or something that was never recorded?</p></div>`}
    else{h+=`<div class="feedback good" style="margin-top:1rem"><p><strong>All responses are correct!</strong> ${n('MCAR')} left for reasons unrelated to the trial. ${n('MAR')} left because the monthly visits were too hard to travel to, and they are the oldest participants, so age, which was recorded, may explain that loss and should be adjusted for in follow-up analyses. ${n('MNAR')} left for reasons the trial didn't measure or gave no reason at all.</p><p style="margin:0">Check out the graph: the filled orange dots are the losses tied to something unrecorded (MNAR). A ${term('sens','sensitivity analysis')} is needed for these participants.</p></div>`}
    return h},
  questions(){const P=PATHS[S.path],subs=S.path==='humans'?DATA.mnar:DATA[S.path];const q=S.q;const M=MULTI[S.path],C=P.conclude;
    const picks=q.m||[];
    let h=`<div class="instr" style="margin-bottom:1rem"><div class="inner"><h2>Check your understanding</h2><p>Compare the two datasets with and without attrition. Click on either chart to enlarge both if needed.</p></div></div>
    <div class="charts pair"><div class="zoomable" data-zoom="ideal" role="button" tabindex="0" aria-label="Enlarge both charts">${chartCard('The data without any attrition',subs,{after:false,stack:true,compact:true})}</div><div class="zoomable" data-zoom="obs" role="button" tabindex="0" aria-label="Enlarge both charts">${chartCard('The real data with attrition',subs,{after:true,stack:true,compact:true})}</div></div>
    <div class="stack" style="margin-top:1.25rem">`;
    h+=`<div class="card"><h3>${C.q}</h3>${optList('qc',C.opts,q.c,null,q.c!=null,C.ans)}${q.c!=null?fb(q.c===C.ans,C.why):''}</div>`;
    if(q.c!=null){const found=M.opts.filter((o,i)=>o.ok&&picks.includes(i)).length,total=M.opts.filter(o=>o.ok).length;
      h+=`<div class="card"><h3>${M.q}</h3><p class="small muted" style="margin:-.25rem 0 .75rem">Each choice is checked as soon as you select it. ${found} of ${total} found.</p><div class="opts" role="group">${order('multi',M.opts.length).map(i=>{const o=M.opts[i];const on=picks.includes(i);const cls='opt check'+(on?(o.ok?' correct':' wrong'):'');return `<button class="${cls}" role="checkbox" aria-checked="${on}" data-multi="${i}" ${on?'disabled':''}><span class="box" aria-hidden="true"></span><span>${o.t}${on?`<span class="opt-why">${o.ok?'Yes.':'No.'} ${o.why}</span>`:''}</span></button>`}).join('')}</div>${found===total?`<div class="feedback good" style="margin-top:.75rem"><p style="margin:0"><strong>All ${total} found.</strong> ${M.why}</p></div>`:''}</div>`}
    h+=`</div>`;
    return h},
  takeaways(){const P=PATHS[S.path],subs=S.path==='humans'?DATA.mnar:DATA[S.path];const b=stats(subs,false),a=stats(subs,true);
    const lost=subs.filter(d=>d.dropped).length,lostT=subs.filter(d=>d.dropped&&d.arm==='treatment').length;const grew=a.diff>b.diff;
    const fmt=v=>(v>=0?'+':'')+v.toFixed(1);
    return `
    <div class="takeaway"><h3>Takeaway: Dropouts will occur no matter how well you design your study.</h3><div class="body"><p style="margin:0">It's your job to understand how to handle these missing data so that your results reflect the data you collected. Understanding how to best prevent these dropouts can aid in reducing dropout rates.</p></div></div>
    <h3 class="tk-h">What you saw</h3>
    <p style="margin:0 0 .75rem">${lost} of ${subs.length} ${P.unit} dropped out, ${lostT} of them from the ${P.arms[1]} group. Here is what that did to the difference between the two group means.</p>
    <div class="stat-strip"><div class="stat"><div class="lbl">If all ${P.pop} were included</div><div class="num">${fmt(b.diff)}</div><div class="sub">${P.arms[1]} ${b.mt.toFixed(1)} vs. ${P.arms[0]} ${b.mc.toFixed(1)}</div></div><div class="stat-arrow"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 11v2h12l-5.5 5.5 1.42 1.42L19.84 12l-7.92-7.92L10.5 5.5 16 11z"/></svg><span>${grew?'increased':'decreased'}</span></div><div class="stat"><div class="lbl">After attrition (what you observed)</div><div class="num">${fmt(a.diff)}</div><div class="sub">${P.arms[1]} ${a.mt.toFixed(1)} vs. ${P.arms[0]} ${a.mc.toFixed(1)}</div></div></div>
    <p class="small muted" style="margin:.5rem 0 0">From the same study you can get differing results depending on attrition. Noting and flagging the data that drop out can help you understand your data more deeply. If some of the attrition seems to be due to treatment then you now have the rationale to follow up on these results and establish the parameters and methods to measure those effects in the next study.</p>
    <h3 class="tk-h">What went wrong</h3>
    <div class="tk-grid">${P.lessons.map(t=>`<div class="tk-card lesson">${Array.isArray(t)?`<ul>${t.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<p>${t}</p>`}</div>`).join('')}</div>
    <h3 class="tk-h">How to prevent it</h3>
    <div class="tk-grid">${P.prevent.map((x,i)=>`<div class="tk-card"><span class="badge" aria-hidden="true">${i+1}</span><h4>${x.t}</h4>${x.d?`<p>${x.d}</p>`:''}</div>`).join('')}</div>`},
};

/* ---------- render ---------- */
function canContinue(){const k=stepList()[S.step].k;
  if(k==='choose')return !!S.path;
  if(k==='ideal')return S.lab.ideal.q1!=null&&S.lab.ideal.q2!=null;
  if(k==='attrition')return S.lab.obs.q1!=null&&S.lab.obs.q2!=null;
  if(k==='log')return S.lab.checked&&DATA[S.path].filter(d=>d.dropped).every(d=>S.lab.sort[d.id]===d.kind);
  if(k==='classify')return S.human.checked&&DATA.mnar.filter(d=>d.dropped).every(d=>S.human.sort[d.id]===d.kind);
  if(k==='questions'){if(S.q.c==null)return false;const M=MULTI[S.path];return M.opts.every((o,i)=>!o.ok||(S.q.m||[]).includes(i))}
  return k!=='congrats'}
function hintFor(){const k=stepList()[S.step].k;
  if(k==='choose'&&!S.path)return 'Pick a research scenario to continue.';
  if(k==='ideal'&&!canContinue())return 'Answer both questions about the ideal result to continue.';
  if(k==='attrition'&&!canContinue())return 'Answer both questions about the actual observed result.';
  if(k==='log'&&!canContinue())return 'Sort every row and check your answers. All rows must be sorted correctly to continue.';
  if(k==='classify'&&!canContinue())return 'Classify every participant who left and check your answers. All rows must be sorted correctly to continue.';
  if(k==='questions'&&!canContinue())return S.q.c!=null?'Find every option that protects against attrition bias to continue.':'Answer the first question to continue.';
  return ''}
function renderZoom(){let z=document.getElementById('zoom');if(!S.zoom){if(z)z.remove();return}
  const subs=S.path==='humans'?DATA.mnar:DATA[S.path];
  if(!z){z=document.createElement('div');z.id='zoom';document.body.appendChild(z)}
  z.innerHTML=`<div class="zoom-overlay" data-zoomclose="1" role="dialog" aria-modal="true" aria-label="Enlarged charts"><div class="zoom-box"><div class="zoom-bar"><span></span><button class="zoom-close" data-act="closezoom" aria-label="Close"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div>
    <div class="charts">${chartCard('The data without any attrition',subs,{after:false})}${chartCard('The real data with attrition',subs,{after:true})}</div></div></div>`}
function render(){const list=stepList();S.step=Math.min(S.step,list.length-1);const k=list[S.step].k;
  const untracked=k==='intro'||k==='congrats';
  const tracked=list.filter(s=>s.k!=='intro'&&s.k!=='congrats');
  document.getElementById('steps').innerHTML=untracked?'':tracked.map((s,i)=>{const j=list.indexOf(s);return `<span class="${j===S.step?'on':j<S.step?'done':''}">${i+1}. ${s.l}</span>`}).join('');
  document.getElementById('steps').hidden=untracked;
  SEEN=new Set();document.getElementById('main').innerHTML=PAGES[k]();
  document.getElementById('prev').disabled=S.step===0;
  const next=document.getElementById('next');next.disabled=!canContinue();
  document.getElementById('nextLabel').textContent=k==='takeaways'?'Complete Activity':'Next';
  document.getElementById('footer').hidden=k==='congrats';document.body.classList.toggle('no-footer',k==='congrats');
  document.getElementById('hint').textContent=hintFor();
  renderZoom();save();if(render.lastStep!==S.step){window.scrollTo({top:0})}render.lastStep=S.step}

(function(){const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);let cur=null;
  function show(el){cur=el;tip.textContent=el.dataset.tip;tip.classList.add('show');const r=el.getBoundingClientRect();tip.style.left='0px';tip.style.top='0px';const w=tip.offsetWidth,h=tip.offsetHeight,GAP=10,PAD=16;
    const cx=r.left+r.width/2;let x=cx-w/2;if(x+w>window.innerWidth-PAD)x=window.innerWidth-PAD-w;if(x<PAD)x=PAD;
    let above=r.top-GAP-h>=PAD;let y=above?r.top-GAP-h:r.bottom+GAP;tip.classList.toggle('above',above);tip.classList.toggle('below',!above);
    tip.style.setProperty('--ax',Math.max(14,Math.min(w-14,cx-x))+'px');tip.style.left=x+'px';tip.style.top=y+'px'}
  function hide(){cur=null;tip.classList.remove('show')}
  document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)show(t);else if(cur)hide()});
  document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)show(t)});
  document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('.term'))hide()});
  document.addEventListener('scroll',()=>{if(cur)show(cur)},true);
})();
document.addEventListener('toggle',e=>{if(e.target.id==='studyDetails'){S.lab.studyOpen=e.target.open;save()}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.zoom){S.zoom=null;renderZoom()}
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.zoom){e.preventDefault();S.zoom=e.target.dataset.zoom;renderZoom()}});
document.addEventListener('click',e=>{
  const zc=e.target.closest('[data-zoomclose]');if(zc&&e.target===zc){S.zoom=null;renderZoom();return}
  const zb=e.target.closest('[data-zoom]');if(zb){S.zoom=zb.dataset.zoom;renderZoom();return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.multi!=null){const i=+b.dataset.multi;S.q.m=S.q.m||[];if(!S.q.m.includes(i))S.q.m.push(i);render();return}
  if(b.dataset.hint){const[k,op]=b.dataset.hint.split(':');S.lab.hint=op==='open';render();return}
  if(b.dataset.act==='closezoom'){S.zoom=null;renderZoom();return}
  if(b.dataset.path){S.path=b.dataset.path;S.salt=Math.floor(Math.random()*1e9);S.lab={ideal:{q1:null,q2:null},revealed:false,obs:{q1:null,q2:null},sort:{},checked:false,studyOpen:false};S.human={sort:{},checked:false};S.q={c:null,m:[]};render();return}
  if(b.dataset.pick){const[name,i]=b.dataset.pick.split(':');const idx=+i;
    if(name==='i1'){if(S.lab.ideal.q1==null)S.lab.ideal.q1=idx}
    else if(name==='i2'){if(S.lab.ideal.q2==null)S.lab.ideal.q2=idx}
    else if(name==='o1'){if(S.lab.obs.q1==null)S.lab.obs.q1=idx}
    else if(name==='o2'){if(S.lab.obs.q2==null)S.lab.obs.q2=idx}
    else if(name==='qc'){if(S.q.c==null)S.q.c=idx}
    render();return}
  if(b.dataset.act){const[a,key]=b.dataset.act.split(':');
    if(a==='sort'){if(S.path==='humans')S.human.checked=true;else S.lab.checked=true}
    if(a==='restart'){S.path=null;S.step=1;S.salt=Math.floor(Math.random()*1e9)}
    if(a==='prevpage'){S.step--}
    if(a==='home'){S.path=null;S.step=0}
    render();return}
  if(b.dataset.sort){const[id,kind]=b.dataset.sort.split(':');(S.path==='humans'?S.human:S.lab).sort[id]=kind;render();return}
  if(b.id==='next'&&canContinue()){S.step++;render()}
  if(b.id==='prev'&&S.step>0){S.step--;render()}
});
render();
</script>

</body>
